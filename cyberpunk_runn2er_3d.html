            );
            holoCurtain.position.y = 2.15;
            g.add(holoCurtain);
            return g;
        }

        // 5) Вооружённый Киберсолдат с шарнирным корпусом, винтовкой, прицельным лазером и полоской HP
        function createMechEnemyMesh() {
            const g = new THREE.Group();
            const armorMat = new THREE.MeshStandardMaterial({ color: 0x1e2236, roughness: 0.3, metalness: 0.82 });
            const redGlowMat = new THREE.MeshBasicMaterial({ color: 0xff2200 });

            // Ноги и наколенники
            [-0.24, 0.24].forEach(lx => {
                const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.11, 0.52, 10), armorMat);
                thigh.position.set(lx, 0.72, 0);
                const shin = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.09, 0.48, 10), darkMetalMat);
                shin.position.set(lx, 0.26, 0);
                const knee = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), redGlowMat);
                knee.position.set(lx, 0.5, 0.08);
                g.add(thigh, shin, knee);
            });

            // Бронированный торс с реактором и наплечниками
            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.28, 0.82, 12), armorMat);
            torso.position.y = 1.38;
            const reactor = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.12, 10), redGlowMat);
            reactor.rotation.x = Math.PI / 2;
            reactor.position.set(0, 1.45, 0.34);
            g.add(torso, reactor);

            [-0.48, 0.48].forEach(sx => {
                const shoulder = new THREE.Mesh(new THREE.SphereGeometry(0.2, 10, 10), armorMat);
                shoulder.position.set(sx, 1.68, 0);
                const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.08, 0.55, 10), darkMetalMat);
                arm.rotation.x = 0.7;
                arm.position.set(sx * 0.85, 1.38, 0.28);
                g.add(shoulder, arm);
            });

            // Шлем киберсолдата с горящим красным оптическим визором
            const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 12), armorMat);
            helmet.scale.set(0.95, 1.1, 1.05);
            helmet.position.y = 2.02;
            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.1, 0.26), redGlowMat);
            visor.position.set(0, 2.02, 0.16);
            g.add(helmet, visor);

            // Лазерная винтовка в руках + красный луч целеуказателя в сторону игрока
            const rifle = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.2, 0.95), darkMetalMat);
            rifle.position.set(0.22, 1.32, 0.55);
            const laserSight = new THREE.Mesh(
                new THREE.CylinderGeometry(0.02, 0.02, 13, 6),
                new THREE.MeshBasicMaterial({ color: 0xff1e42, transparent: true, opacity: 0.65 })
            );
            laserSight.rotation.x = Math.PI / 2;
            laserSight.position.set(0.22, 1.34, 7.2);
            g.add(rifle, laserSight);

            // Наземная голографическая дорожка опасности + индикатор HP над головой
            const warnZone = new THREE.Mesh(
                new THREE.PlaneGeometry(1.9, 13.5),
                new THREE.MeshBasicMaterial({ color: 0xff1e42, transparent: true, opacity: 0.18, side: THREE.DoubleSide })
            );
            warnZone.rotation.x = -Math.PI / 2;
            warnZone.position.set(0, 0.03, 7.2);

            const hpBg = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.14), new THREE.MeshBasicMaterial({ color: 0x0b0e1a, side: THREE.DoubleSide }));
            hpBg.position.set(0, 2.52, 0);
            const hpBar = new THREE.Mesh(new THREE.PlaneGeometry(1.04, 0.09), new THREE.MeshBasicMaterial({ color: 0xff2a6d, side: THREE.DoubleSide }));
            hpBar.position.set(0, 2.52, 0.02);
            g.userData.hpBar = hpBar;

            g.add(warnZone, hpBg, hpBar);
            return g;
        }

        // Фабрика объёмного золотого шестиугольного кредита (как на скриншоте)
        const hexCoinGeo = new THREE.CylinderGeometry(0.58, 0.58, 0.16, 6);
        hexCoinGeo.rotateZ(Math.PI / 2);
        const hexCoinMat = new THREE.MeshStandardMaterial({
            color: 0xffb703,
            emissive: 0xff8800,
            emissiveIntensity: 0.65,
            roughness: 0.2,
            metalness: 0.9
        });
        const hexInnerGeo = new THREE.CylinderGeometry(0.34, 0.34, 0.2, 6);
        hexInnerGeo.rotateZ(Math.PI / 2);
        const hexInnerMat = new THREE.MeshBasicMaterial({ color: 0xfff3b0 });

        function createCoinMesh() {
            const g = new THREE.Group();
            const outer = new THREE.Mesh(hexCoinGeo, hexCoinMat);
            const inner = new THREE.Mesh(hexInnerGeo, hexInnerMat);
            g.add(outer, inner);
            return g;
        }

        // Фабрика капсул восстановления здоровья (Medkit) и батарей энергии (Nano-Battery)
        function createPowerupMesh(kind) {
            const g = new THREE.Group();
            const mat = kind === 'HP' ? neonPinkMat : neonCyanMat;
            const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.48, 0), mat);
            const ring = new THREE.Mesh(new THREE.TorusGeometry(0.64, 0.06, 8, 18), new THREE.MeshBasicMaterial({ color: 0xffffff }));
            g.add(core, ring);
            return g;
        }

        // Неоновые линии скорости / кибер-дождь в воздухе для ощущения высокой скорости
        const speedLinesGroup = new THREE.Group();
        scene.add(speedLinesGroup);
        const speedDrops = [];
        const dropGeo = new THREE.BoxGeometry(0.035, 0.035, 3.8);
        for (let i = 0; i < 45; i++) {
            const drop = new THREE.Mesh(dropGeo, i % 3 === 0 ? neonPinkMat : neonCyanMat);
            drop.position.set(
                (Math.random() - 0.5) * 22,
                1 + Math.random() * 14,
                -Math.random() * 120
            );
            speedLinesGroup.add(drop);
            speedDrops.push(drop);
        }

        // Спавн волн препятствий, кредитов и врагов на полосах
        const LANES = [-3.4, 0, 3.4];

        function spawnEncounterWave(zPos) {
            const freeLane = Math.floor(Math.random() * 3);
            const hazardType = Math.random();

            for (let l = 0; l < 3; l++) {
                const lx = LANES[l];
                if (l === freeLane) {
                    const roll = Math.random();
                    if (roll > 0.35) {
                        // Цепочка из 3 золотых кредитов вдоль свободной полосы
                        for (let c = 0; c < 3; c++) {
                            const coin = createCoinMesh();
                            coin.position.set(lx, 0.85, zPos - c * 3.2);
                            scene.add(coin);
                            coins.push({ mesh: coin, z: zPos - c * 3.2, kind: 'COIN', taken: false });
                        }
                    } else if (roll > 0.18) {
                        const kind = Math.random() > 0.5 ? 'HP' : 'ENERGY';
                        const pMesh = createPowerupMesh(kind);
                        pMesh.position.set(lx, 1.0, zPos);
                        scene.add(pMesh);
                        coins.push({ mesh: pMesh, z: zPos, kind, taken: false });
                    }
                } else {
                    if (hazardType < 0.30) {
                        const obs = createHoloBarrierMesh();
                        obs.position.set(lx, 0, zPos);
                        scene.add(obs);
                        obstacles.push({ mesh: obs, lane: l, z: zPos, type: 'JUMP', hit: false });
                    } else if (hazardType < 0.58) {
                        const truck = Math.random() > 0.42 ? createCyberTruckMesh() : createCargoCrateMesh();
                        truck.position.set(lx, 0, zPos);
                        scene.add(truck);
                        obstacles.push({ mesh: truck, lane: l, z: zPos, type: 'AVOID', hit: false });
                    } else if (hazardType < 0.80) {
                        const gate = createSlideGateMesh();
                        gate.position.set(lx, 0, zPos);
                        scene.add(gate);
                        obstacles.push({ mesh: gate, lane: l, z: zPos, type: 'SLIDE', hit: false });
                    } else {
                        const mech = createMechEnemyMesh();
                        mech.position.set(lx, 0, zPos);
                        scene.add(mech);
                        enemies.push({ mesh: mech, lane: l, z: zPos, hp: 60, attackCooldown: 1.5 });
                    }
                }
            }
        }

        for (let z = -36; z > -280; z -= 34) {
            spawnEncounterWave(z);
        }

        // ==========================================
        // 8. Спавн искр и система прицеливания (Auto-Aim)
        // ==========================================
        function spawnSparks(pos, colorHex, count = 12) {
            const mat = new THREE.MeshBasicMaterial({ color: colorHex });
            for (let i = 0; i < count; i++) {
                const s = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.12), mat);
                s.position.copy(pos);
                scene.add(s);
                particles.push({
                    mesh: s,
                    vel: new THREE.Vector3((Math.random() - 0.5) * 11, Math.random() * 9 + 2, (Math.random() - 0.5) * 11),
                    life: 0.35 + Math.random() * 0.25
                });
            }
        }

        let lockedEnemy = null;
        function updateTargetLock() {
            let closest = null;
            let minDist = 45;
            for (const e of enemies) {
                const dist = playerGroup.position.distanceTo(e.mesh.position);
                if (dist < minDist && e.z < playerGroup.position.z && e.z > playerGroup.position.z - 40) {
                    minDist = dist;
                    closest = e;
                }
            }
            lockedEnemy = closest;

            const reticle = document.getElementById('target-reticle');
            if (lockedEnemy && state.mode === 'PLAY') {
                const worldPos = lockedEnemy.mesh.position.clone().add(new THREE.Vector3(0, 1.6, 0));
                worldPos.project(camera);
                if (worldPos.z < 1) {
                    const x = (worldPos.x * 0.5 + 0.5) * window.innerWidth;
                    const y = (-worldPos.y * 0.5 + 0.5) * window.innerHeight;
                    reticle.style.left = `${x}px`;
                    reticle.style.top = `${y}px`;
                    reticle.style.display = 'block';
                    return;
                }
            }
            reticle.style.display = 'none';
        }

        function fireWeapon() {
            audio.shoot();
            muzzleFlash.material.opacity = 1;
            muzzleFlash.rotation.z = Math.random() * Math.PI;

            const startPos = playerGroup.position.clone().add(new THREE.Vector3(0.55, 1.35, -0.9));
            const pellets = state.weaponMode === 1 ? 3 : 1;

            for (let p = 0; p < pellets; p++) {
                const tracer = new THREE.Mesh(
                    new THREE.BoxGeometry(0.12, 0.12, 2.4),
                    new THREE.MeshBasicMaterial({ color: state.weaponMode === 1 ? 0xff2a85 : 0xffcc00 })
                );
                tracer.position.copy(startPos);
                scene.add(tracer);

                let dir = new THREE.Vector3((p - Math.floor(pellets / 2)) * 0.06, 0, -1).normalize();
                if (lockedEnemy) {
                    const targetCenter = lockedEnemy.mesh.position.clone().add(new THREE.Vector3(0, 1.5, 0));
                    dir = targetCenter.sub(startPos).normalize();
                }
                bullets.push({ mesh: tracer, dir, speed: 145, dmg: state.weaponMode === 1 ? 22 : 30, life: 0.9 });
            }
        }

        function performKatanaAttack() {
            if (state.katanaTimer > 0) return;
            audio.katana();
            state.katanaDuration = state.combo >= 5 ? 0.24 : 0.30;
            state.katanaTimer = state.katanaDuration;
            state.slashComboStep = (state.slashComboStep + 1) % 2;

            katanaSlashArc.visible = true;
            // Наклон плоскости удара по диагонали (чередуем угол рассечения слева-направо и справа-налево)
            const tiltZ = state.slashComboStep === 0 ? -0.48 : 0.48;
            katanaSlashArc.rotation.set(0.22, 0, tiltZ);
            katanaSlashArc.userData.outerMat.opacity = 0.92;
            katanaSlashArc.userData.innerMat.opacity = 0.78;

            drawnKatanaGroup.visible = true;
            katanaHiltInSheath.visible = false;
            spawnSparks(playerGroup.position.clone().add(new THREE.Vector3(0, 1.35, -1.6)), 0x00f0ff, 10);

            const pz = playerGroup.position.z;
            const px = playerGroup.position.x;

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                const dz = pz - e.z;
                const dx = Math.abs(px - e.mesh.position.x);
                if (dz > -1.5 && dz < 9.5 && dx < 3.0) {
                    e.hp = 0;
                    registerEnemyKill(e.mesh.position, true);
                    scene.remove(e.mesh);
                    enemies.splice(i, 1);
                }
            }
        }

        function registerEnemyKill(pos, isMelee = false) {
            state.kills++;
            state.combo++;
            state.comboTimer = 4.5;
            const mult = state.combo >= 5 ? 3 : (state.combo >= 2 ? 2 : 1);
            const reward = (isMelee ? 6 : 3) * mult;
            state.coins += reward;
            state.energy = Math.min(state.maxEnergy, state.energy + (isMelee ? 14 : 8));
            spawnSparks(pos.clone().add(new THREE.Vector3(0, 1.5, 0)), 0xff1e78, 26);
            spawnFloatingText(pos.clone().add(new THREE.Vector3(0, 2.3, 0)), `+${reward}₢ ${mult > 1 ? 'x' + mult : ''}`, '#ff2a6d');
        }

        function performCyberDash() {
            if (state.mode !== 'PLAY' || state.dashTimer > 0 || state.energy < 25) return;
            state.energy -= 25;
            state.dashTimer = 0.38;
            state.shake = 0.22;
            audio.dash();
            spawnSparks(playerGroup.position.clone().add(new THREE.Vector3(0, 1.1, 0)), 0x00f0ff, 20);
        }

        function takeDamage(amount) {
            if (state.dashTimer > 0) return; // Неуязвимость во время Кибер-Рывка
            state.hp = Math.max(0, state.hp - amount);
            state.combo = 0;
            state.comboTimer = 0;
            state.shake = 0.35;
            audio.hit();
            const dmgFx = document.getElementById('damage-fx');
            dmgFx.style.opacity = '1';
            setTimeout(() => { dmgFx.style.opacity = '0'; }, 180);

            if (state.hp <= 0) {
                openModal('GAME OVER', 'Связь с кибер-декой прервана', false);
            }
        }

        // ==========================================
        // 9. Управление: Клавиатура, Свайпы, Джойстик и Кнопки
        // ==========================================
        function switchLane(delta) {
            if (state.mode !== 'PLAY') return;
            const next = Math.max(0, Math.min(2, hero.lane + delta));
            hero.lane = next;
            hero.targetX = LANES[next];
        }

        function doJump() {
            if (state.mode !== 'PLAY' || hero.jumping) return;
            hero.jumping = true;
            hero.sliding = false;
            hero.vy = 17.5;
            audio.jump();
        }

        function doSlide() {
            if (state.mode !== 'PLAY') return;
            hero.sliding = true;
            hero.slideTime = 0.65;
            if (hero.jumping) hero.vy = -24;
            audio.slide();
        }

        function toggleSandy() {
            if (state.mode !== 'PLAY') return;
            if (!state.sandyActive && state.energy >= 20) {
                state.sandyActive = true;
                audio.sandy();
                document.getElementById('sandy-fx').style.opacity = '1';
            } else {
                state.sandyActive = false;
                document.getElementById('sandy-fx').style.opacity = '0';
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Escape') {
                e.preventDefault();
                if (state.mode === 'PLAY') {
                    openModal('ПАУЗА', 'Нейролинк в режиме ожидания', true);
                } else if (state.mode === 'PAUSE') {
                    resumeGame();
                }
                return;
            }

            if (state.mode !== 'PLAY') return;
            switch (e.code) {
                case 'ArrowLeft':
                case 'KeyA': switchLane(-1); break;
                case 'ArrowRight':
                case 'KeyD': switchLane(1); break;
                case 'ArrowUp':
                case 'KeyW': doJump(); break;
                case 'ArrowDown':
                case 'KeyS': doSlide(); break;
                case 'Space': state.firing = true; break;
                case 'KeyE': performKatanaAttack(); break;
                case 'KeyQ': toggleSandy(); break;
                case 'ShiftLeft':
                case 'ShiftRight': performCyberDash(); break;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') state.firing = false;
        });

        // ==========================================
        // 10. HUD, Модальные окна и Сенсорные кнопки
        // ==========================================
        function syncHUD() {
            const hpPct = Math.max(0, Math.min(100, (state.hp / state.maxHp) * 100));
            const enPct = Math.max(0, Math.min(100, (state.energy / state.maxEnergy) * 100));
            document.getElementById('hp-fill').style.width = `${hpPct}%`;
            document.getElementById('hp-text').textContent = `${Math.ceil(state.hp)} / ${state.maxHp}`;
            document.getElementById('energy-fill').style.width = `${enPct}%`;
            document.getElementById('energy-text').textContent = `${Math.floor(state.energy)} / ${state.maxEnergy}`;

            const distInt = Math.floor(state.distance);
            document.getElementById('hud-distance').textContent = `${distInt.toLocaleString('en-US')} m`;
            if (distInt > state.bestDistance) {
                state.bestDistance = distInt;
                localStorage.setItem('cyber_runner_best3d', String(state.bestDistance));
            }
            document.getElementById('hud-best').textContent = `${state.bestDistance.toLocaleString('en-US')} m`;
            document.getElementById('hud-coins').textContent = String(state.coins);
            document.getElementById('hud-kills').textContent = String(state.kills);

            const comboBox = document.getElementById('hud-combo-box');
            const comboText = document.getElementById('hud-combo');
            const overdriveEl = document.getElementById('hud-overdrive');
            if (state.combo >= 2) {
                comboBox.classList.remove('hidden');
                comboText.textContent = `x${state.combo}`;
                if (state.combo >= 5) overdriveEl.classList.remove('hidden');
                else overdriveEl.classList.add('hidden');
            } else {
                comboBox.classList.add('hidden');
            }
        }

        function openModal(title, subtitle, canResume = true) {
            state.mode = canResume ? 'PAUSE' : 'GAMEOVER';
            state.firing = false;
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-subtitle').textContent = subtitle;
            document.getElementById('stat-dist').textContent = `${Math.floor(state.distance)} m`;
            document.getElementById('stat-coins').textContent = String(state.coins);
            document.getElementById('stat-kills').textContent = String(state.kills);
            document.getElementById('btn-resume').style.display = canResume ? 'block' : 'none';
            document.getElementById('modal-overlay').classList.remove('hidden');
        }

        function resumeGame() {
            if (state.hp <= 0) return;
            state.mode = 'PLAY';
            document.getElementById('modal-overlay').classList.add('hidden');
        }

        function resetGame() {
            state.hp = state.maxHp;
            state.energy = state.maxEnergy;
            state.distance = 0;
            state.speed = 36;
            state.sandyActive = false;
            state.firing = false;
            state.katanaTimer = 0;
            state.dashTimer = 0;
            state.combo = 0;
            state.comboTimer = 0;
            document.getElementById('sandy-fx').style.opacity = '0';
            document.getElementById('damage-fx').style.opacity = '0';

            hero.lane = 1;
            hero.targetX = 0;
            hero.y = 0;
            hero.vy = 0;
            hero.jumping = false;
            hero.sliding = false;
            playerGroup.position.set(0, 0, 0);

            obstacles.forEach(o => scene.remove(o.mesh));
            obstacles.length = 0;
            enemies.forEach(e => scene.remove(e.mesh));
            enemies.length = 0;
            coins.forEach(c => scene.remove(c.mesh));
            coins.length = 0;
            bullets.forEach(b => scene.remove(b.mesh));
            bullets.length = 0;

            segments.forEach((seg, i) => {
                seg.position.z = -i * SEG_LENGTH;
            });
            for (let z = -36; z > -280; z -= 34) {
                spawnEncounterWave(z);
            }

            state.mode = 'PLAY';
            document.getElementById('modal-overlay').classList.add('hidden');
            syncHUD();
        }

        // Привязка кнопок интерфейса и сенсорного управления
        document.getElementById('btn-pause').addEventListener('click', () => {
            audio.init();
            if (state.mode === 'PLAY') openModal('ПАУЗА', 'Нейролинк в режиме ожидания', true);
            else if (state.mode === 'PAUSE') resumeGame();
        });
        document.getElementById('btn-resume').addEventListener('click', () => {
            audio.init();
            resumeGame();
        });
        document.getElementById('btn-restart').addEventListener('click', () => {
            audio.init();
            resetGame();
        });
        document.getElementById('btn-sound').addEventListener('click', () => {
            audio.init();
            audio.enabled = !audio.enabled;
            document.getElementById('sound-label').textContent = audio.enabled ? '🔊' : '🔇';
        });

        const btnFire = document.getElementById('btn-fire');
        btnFire.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            audio.init();
            state.firing = true;
            fireWeapon();
            state.lastShot = performance.now();
        });
        window.addEventListener('pointerup', () => { state.firing = false; });

        document.getElementById('btn-katana').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            audio.init();
            performKatanaAttack();
        });
        document.getElementById('btn-sandy').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            audio.init();
            toggleSandy();
        });
        document.getElementById('btn-dash').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            audio.init();
            performCyberDash();
        });
        document.getElementById('btn-swap').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            audio.init();
            state.weaponMode = (state.weaponMode + 1) % 2;
            spawnFloatingText(
                playerGroup.position.clone().add(new THREE.Vector3(0, 2.2, 0)),
                state.weaponMode === 1 ? 'SHOTGUN MODE' : 'PULSE RIFLE',
                '#00f0ff'
            );
        });
        document.getElementById('btn-aim').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            audio.init();
            updateTargetLock();
            fireWeapon();
        });

        // Свайпы по экрану и виртуальный джойстик
        let touchStartX = 0, touchStartY = 0, touchActive = false;
        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');

        joyZone.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            audio.init();
            touchActive = true;
            touchStartX = e.clientX;
            touchStartY = e.clientY;
        });

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('button') || e.target.closest('#joystick-zone') || e.target.closest('#modal-overlay')) return;
            audio.init();
            touchActive = true;
            touchStartX = e.clientX;
            touchStartY = e.clientY;
        });

        window.addEventListener('pointermove', (e) => {
            if (!touchActive) return;
            const dx = e.clientX - touchStartX;
            const dy = e.clientY - touchStartY;
            const clampX = Math.max(-24, Math.min(24, dx * 0.45));
            const clampY = Math.max(-24, Math.min(24, dy * 0.45));
            joyKnob.style.transform = `translate(${clampX}px, ${clampY}px)`;

            if (Math.abs(dx) > 34 || Math.abs(dy) > 34) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    switchLane(dx > 0 ? 1 : -1);
                } else {
                    if (dy < 0) doJump();
                    else doSlide();
                }
                touchActive = false;
                setTimeout(() => { joyKnob.style.transform = 'translate(0px, 0px)'; }, 90);
            }
        });

        window.addEventListener('pointerup', () => {
            touchActive = false;
            joyKnob.style.transform = 'translate(0px, 0px)';
        });

        // ==========================================
        // 11. Главный Игровой Цикл (60 FPS)
        // ==========================================
        let prevTime = performance.now();

        function gameLoop(now) {
            requestAnimationFrame(gameLoop);

            const rawDt = Math.min(0.05, (now - prevTime) / 1000);
            prevTime = now;

            if (state.mode === 'PLAY') {
                const worldDt = state.sandyActive ? rawDt * 0.3 : rawDt;

                // Обработка Кибер-Рывка (Cyber Dash) и таймера Комбо
                if (state.dashTimer > 0) {
                    state.dashTimer = Math.max(0, state.dashTimer - rawDt);
                }
                if (state.comboTimer > 0) {
                    state.comboTimer -= rawDt;
                    if (state.comboTimer <= 0) state.combo = 0;
                }

                // Разгон и продвижение вперёд (с ускорением во время рывка и Overdrive)
                state.speed = Math.min(state.maxSpeed, state.speed + worldDt * 0.35);
                const dashMultiplier = state.dashTimer > 0 ? 2.15 : (state.combo >= 5 ? 1.12 : 1.0);
                const moveZ = state.speed * dashMultiplier * worldDt;
                playerGroup.position.z -= moveZ;
                state.distance += moveZ * 0.45;

                // Горизонт мегаполиса и скоростные частицы дождя движутся вместе с игроком
                skylineGroup.position.z = playerGroup.position.z;
                for (const drop of speedDrops) {
                    drop.position.z += (state.speed * 1.9) * rawDt;
                    if (drop.position.z > playerGroup.position.z + 8) {
                        drop.position.z = playerGroup.position.z - 95 - Math.random() * 35;
                        drop.position.x = playerGroup.position.x + (Math.random() - 0.5) * 20;
                    }
                }

                // Расход / регенерация энергии Сандевистана
                if (state.sandyActive) {
                    state.energy -= 28 * rawDt;
                    if (state.energy <= 0) {
                        state.energy = 0;
                        toggleSandy();
                    }
                } else {
                    state.energy = Math.min(state.maxEnergy, state.energy + 12 * rawDt);
                }

                // Плавное перестроение между полосами с наклоном корпуса
                const diffX = hero.targetX - playerGroup.position.x;
                playerGroup.position.x += diffX * Math.min(1, rawDt * 14);
                playerGroup.rotation.z = -diffX * 0.08;

                // Физика прыжка
                if (hero.jumping) {
                    hero.y += hero.vy * rawDt;
                    hero.vy -= 46 * rawDt;
                    if (hero.y <= 0) {
                        hero.y = 0;
                        hero.vy = 0;
                        hero.jumping = false;
                    }
                }

                // Подкат
                if (hero.sliding) {
                    hero.slideTime -= rawDt;
                    playerGroup.scale.set(1.05, 0.48, 1.05);
                    if (hero.slideTime <= 0) {
                        hero.sliding = false;
                        playerGroup.scale.set(1, 1, 1);
                    }
                } else {
                    playerGroup.scale.set(1, 1, 1);
                }
                playerGroup.position.y = hero.y;

                // Полноценная шарнирная биомеханика бега (сгиб коленей, локтей, наклон и скручивание торса)
                const cycle = now * 0.017;
                const lSin = Math.sin(cycle);
                const rSin = Math.sin(cycle + Math.PI);

                if (!hero.jumping && !hero.sliding) {
                    leftLeg.rotation.x = lSin * 0.85;
                    rightLeg.rotation.x = rSin * 0.85;
                    // Колени сгибаются назад при переносе ноги
                    leftLeg.userData.shin.rotation.x = -Math.max(0, -lSin) * 1.15 - 0.12;
                    rightLeg.userData.shin.rotation.x = -Math.max(0, -rSin) * 1.15 - 0.12;

                    // Правая рука удерживает винтовку с гашением отдачи
                    rightArm.rotation.x = 0.25 + lSin * 0.1;
                    rightArm.userData.forearm.rotation.x = 0.35 + (muzzleFlash.material.opacity * 0.22);

                    // Динамический наклон корпуса вперёд и поворот плеч
                    torso.rotation.x = state.dashTimer > 0 ? -0.42 : -0.18;
                    torso.rotation.y = lSin * 0.14;
                    PelvisNode.position.y = 1.0 + Math.abs(Math.cos(cycle)) * 0.07;

                    // Неоновые следы от кроссовок на мокром асфальте
                    hero.trailTimer -= rawDt;
                    if (hero.trailTimer <= 0) {
                        hero.trailTimer = state.sandyActive || state.dashTimer > 0 ? 0.035 : 0.075;
                        const footSide = lSin > 0 ? -0.18 : 0.18;
                        const trail = new THREE.Mesh(
                            new THREE.BoxGeometry(0.18, 0.04, 0.65),
                            state.sandyActive ? neonCyanMat : neonPinkMat
                        );
                        trail.position.set(playerGroup.position.x + footSide, 0.03, playerGroup.position.z + 0.4);
                        scene.add(trail);
                        particles.push({ mesh: trail, vel: new THREE.Vector3(0, 0, 0), life: 0.28 });
                    }
                } else if (hero.jumping) {
                    leftLeg.rotation.x = 0.55;
                    leftLeg.userData.shin.rotation.x = -0.95;
                    rightLeg.rotation.x = -0.25;
                    rightLeg.userData.shin.rotation.x = -0.65;
                    torso.rotation.x = -0.24;
                }

                // Анимация левой руки и взмаха катаны (работает и на бегу, и в прыжке, и в подкате)
                if (state.katanaTimer > 0) {
                    const p = 1 - (state.katanaTimer / state.katanaDuration); // прогресс удара 0..1
                    const easeOut = 1 - Math.pow(1 - p, 3);
                    const dirSign = state.slashComboStep === 0 ? 1 : -1;
                    const sweepAngle = (-1.25 + easeOut * 2.5) * dirSign;

                    // Разворот корпуса за клинком
                    torso.rotation.y = -sweepAngle * 0.45;
                    torso.rotation.x = -0.28;

                    // Вынос плеча вперёд и горизонтально-диагональная дуга перед собой
                    leftArm.rotation.x = 1.38;
                    leftArm.rotation.y = -sweepAngle * 0.95;
                    leftArm.rotation.z = -0.35 * dirSign;
                    leftArm.userData.forearm.rotation.x = 0.22;

                    // Доворот кисти так, чтобы лезвие резало воздух по дуге впереди героя
                    drawnKatanaGroup.rotation.set(0.35, 0, dirSign * 0.45);
                } else {
                    leftArm.rotation.x = rSin * 0.65;
                    leftArm.rotation.y = 0;
                    leftArm.rotation.z = 0.08;
                    leftArm.userData.forearm.rotation.x = 0.55 + Math.max(0, rSin) * 0.45;
                    drawnKatanaGroup.rotation.set(0, 0, 0);
                }

                // Затухание дульной вспышки и взмаха катаны
                if (muzzleFlash.material.opacity > 0) {
                    muzzleFlash.material.opacity = Math.max(0, muzzleFlash.material.opacity - rawDt * 12);
                }
                if (state.katanaTimer > 0) {
                    state.katanaTimer -= rawDt;
                    const p = 1 - Math.max(0, state.katanaTimer / state.katanaDuration);
                    const dirSign = state.slashComboStep === 0 ? 1 : -1;
                    // Быстрый пролёт полумесяца по дуге рассечения + плавное исчезновение
                    katanaSlashArc.rotation.y = (-1.1 + p * 2.2) * dirSign;
                    const fade = Math.sin(p * Math.PI);
                    katanaSlashArc.userData.outerMat.opacity = fade * 0.9;
                    katanaSlashArc.userData.innerMat.opacity = fade * 0.75;
                    katanaSlashArc.scale.setScalar(0.88 + p * 0.28);

                    if (state.katanaTimer <= 0) {
                        katanaSlashArc.userData.outerMat.opacity = 0;
                        katanaSlashArc.userData.innerMat.opacity = 0;
                        katanaSlashArc.visible = false;
                        drawnKatanaGroup.visible = false;
                        katanaHiltInSheath.visible = true;
                    }
                } else if (katanaSlashArc.visible) {
                    katanaSlashArc.userData.outerMat.opacity = 0;
                    katanaSlashArc.userData.innerMat.opacity = 0;
                    katanaSlashArc.visible = false;
                }

                // Автоматическая стрельба при удержании
                if (state.firing && now - state.lastShot > 135) {
                    fireWeapon();
                    state.lastShot = now;
                }

                // Бесконечная перестановка сегментов города и спавн новых волн
                for (const seg of segments) {
                    if (seg.position.z > playerGroup.position.z + SEG_LENGTH * 0.85) {
                        const minZ = Math.min(...segments.map(s => s.position.z));
                        seg.position.z = minZ - SEG_LENGTH;
                        spawnEncounterWave(seg.position.z + 16);
                        spawnEncounterWave(seg.position.z - 12);
                    }
                }

                // Движение летающих машин в небе
                for (const fc of flyingCars) {
                    fc.mesh.position.z += fc.speed * worldDt;
                    if (fc.mesh.position.z > playerGroup.position.z + 25) {
                        fc.mesh.position.z = playerGroup.position.z - 240 - Math.random() * 60;
                        fc.mesh.position.x = (Math.random() - 0.5) * 34;
                    }
                }

                const pPos = playerGroup.position;

                // Проверка препятствий
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const o = obstacles[i];
                    if (o.z > pPos.z + 18) {
                        scene.remove(o.mesh);
                        obstacles.splice(i, 1);
                        continue;
                    }
                    const dz = Math.abs(pPos.z - o.z);
                    const dx = Math.abs(pPos.x - LANES[o.lane]);
                    if (!o.hit && dz < 1.35 && dx < 1.15) {
                        let avoided = false;
                        if (o.type === 'JUMP' && hero.y > 0.85) avoided = true;
                        if (o.type === 'SLIDE' && hero.sliding) avoided = true;
                        if (state.dashTimer > 0) {
                            // Во время Кибер-Рывка герой пробивает баррикаду без урона
                            avoided = true;
                            o.hit = true;
                            spawnSparks(o.mesh.position.clone().add(new THREE.Vector3(0, 1.0, 0)), 0x00f0ff, 22);
                            scene.remove(o.mesh);
                            obstacles.splice(i, 1);
                            continue;
                        }

                        if (!avoided) {
                            o.hit = true;
                            takeDamage(45);
                            spawnSparks(pPos.clone().add(new THREE.Vector3(0, 1.2, -1)), 0xff2a6d, 18);
                        }
                    }
                }

                // Сбор золотых кредитов и энергетических/медицинских капсул
                for (let i = coins.length - 1; i >= 0; i--) {
                    const c = coins[i];
                    c.mesh.rotation.y += rawDt * 3.5;
                    if (c.z > pPos.z + 15) {
                        scene.remove(c.mesh);
                        coins.splice(i, 1);
                        continue;
                    }
                    if (!c.taken && pPos.distanceTo(c.mesh.position) < 1.95) {
                        c.taken = true;
                        if (c.kind === 'HP') {
                            state.hp = Math.min(state.maxHp, state.hp + 65);
                            audio.pickup();
                            spawnSparks(c.mesh.position, 0xff2a6d, 14);
                            spawnFloatingText(c.mesh.position, '+65 HP', '#ff2a6d');
                        } else if (c.kind === 'ENERGY') {
                            state.energy = Math.min(state.maxEnergy, state.energy + 45);
                            audio.pickup();
                            spawnSparks(c.mesh.position, 0x00f0ff, 14);
                            spawnFloatingText(c.mesh.position, '+45 ENERGY', '#00f0ff');
                        } else {
                            state.coins += 1;
                            audio.coin();
                            spawnSparks(c.mesh.position, 0xffd166, 8);
                        }
                        scene.remove(c.mesh);
                        coins.splice(i, 1);
                    }
                }

                // Враги и их выстрелы
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const e = enemies[i];
                    if (e.z > pPos.z + 15) {
                        scene.remove(e.mesh);
                        enemies.splice(i, 1);
                        continue;
                    }
                    e.attackCooldown -= worldDt;
                    const distZ = pPos.z - e.z;
                    if (e.attackCooldown <= 0 && distZ > 4 && distZ < 16 && hero.lane === e.lane) {
                        e.attackCooldown = 2.0;
                        takeDamage(25);
                    }
                    // Прямое столкновение с врагом
                    if (Math.abs(distZ) < 1.2 && Math.abs(pPos.x - LANES[e.lane]) < 1.15) {
                        takeDamage(40);
                        spawnSparks(e.mesh.position, 0xff2200, 18);
                        scene.remove(e.mesh);
                        enemies.splice(i, 1);
                    }
                }

                // Полёт пуль и попадания по врагам
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];
                    b.mesh.position.addScaledVector(b.dir, b.speed * rawDt);
                    b.life -= rawDt;

                    for (let j = enemies.length - 1; j >= 0; j--) {
                        const e = enemies[j];
                        const hitCenter = e.mesh.position.clone().add(new THREE.Vector3(0, 1.5, 0));
                        if (b.mesh.position.distanceTo(hitCenter) < 1.55) {
                            e.hp -= b.dmg;
                            if (e.mesh.userData.hpBar) {
                                e.mesh.userData.hpBar.scale.x = Math.max(0.01, e.hp / 60);
                            }
                            b.life = 0;
                            spawnSparks(b.mesh.position, 0x00f0ff, 9);
                            spawnFloatingText(hitCenter, `-${b.dmg}`, '#00f0ff');
                            if (e.hp <= 0) {
                                registerEnemyKill(e.mesh.position, false);
                                scene.remove(e.mesh);
                                enemies.splice(j, 1);
                            }
                            break;
                        }
                    }

                    if (b.life <= 0) {
                        scene.remove(b.mesh);
                        bullets.splice(i, 1);
                    }
                }

                updateTargetLock();
                syncHUD();
            }

            // Анимация разлетающихся искр
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.mesh.position.addScaledVector(p.vel, rawDt);
                p.life -= rawDt;
                p.mesh.scale.multiplyScalar(0.92);
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }

            // Кинематографичная камера от 3-го лица + динамический FOV при ускорении
            const targetFov = state.dashTimer > 0 ? 78 : (state.sandyActive ? 72 : 65);
            if (Math.abs(camera.fov - targetFov) > 0.1) {
                camera.fov += (targetFov - camera.fov) * 0.15;
                camera.updateProjectionMatrix();
            }

            if (state.shake > 0) state.shake = Math.max(0, state.shake - rawDt * 2.2);
            const shakeOffset = state.shake > 0 ? (Math.random() - 0.5) * state.shake : 0;

            const desiredCamX = playerGroup.position.x * 0.55 + 0.55 + shakeOffset;
            const desiredCamY = playerGroup.position.y * 0.35 + (state.sandyActive ? 2.45 : 2.85) + shakeOffset;
            const desiredCamZ = playerGroup.position.z + (state.sandyActive ? 4.9 : 5.7);

            camera.position.x += (desiredCamX - camera.position.x) * 0.14;
            camera.position.y += (desiredCamY - camera.position.y) * 0.14;
            camera.position.z += (desiredCamZ - camera.position.z) * 0.25;

            camera.lookAt(
                playerGroup.position.x * 0.35,
                playerGroup.position.y * 0.2 + 2.1,
                playerGroup.position.z - 22
            );

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
