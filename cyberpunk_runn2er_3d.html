<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CYBERPUNK RUNNER 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b071a;
            font-family: 'Inter', sans-serif;
        }
        .font-cyber {
            font-family: 'Orbitron', sans-serif;
        }
        .font-hud {
            font-family: 'Rajdhani', sans-serif;
        }
        #webgl-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* Скошенные полоски здоровья и энергии как на референсе */
        .skew-bar {
            transform: skewX(-24deg);
        }
        .skew-bar-inner {
            transform: skewX(24deg);
        }
        .hud-panel {
            background: rgba(11, 14, 28, 0.72);
            border: 1px solid rgba(0, 240, 255, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .hex-avatar {
            clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
        }
        /* Круглые экшен-кнопки справа внизу */
        .action-circle {
            border-radius: 9999px;
            backdrop-filter: blur(6px);
            transition: transform 0.08s ease, box-shadow 0.12s ease, filter 0.1s ease;
        }
        .action-circle:active {
            transform: scale(0.9);
            filter: brightness(1.35);
        }
        .btn-fire-glow {
            background: radial-gradient(circle, rgba(255, 20, 100, 0.38) 0%, rgba(18, 10, 30, 0.88) 75%);
            border: 2.5px solid #ff2a6d;
            box-shadow: 0 0 22px rgba(255, 42, 109, 0.65), inset 0 0 14px rgba(255, 42, 109, 0.4);
        }
        .btn-katana-glow {
            background: radial-gradient(circle, rgba(255, 42, 109, 0.28) 0%, rgba(16, 10, 28, 0.88) 75%);
            border: 2px solid #ff2a6d;
            box-shadow: 0 0 16px rgba(255, 42, 109, 0.5), inset 0 0 10px rgba(255, 42, 109, 0.3);
        }
        .btn-sandy-glow {
            background: radial-gradient(circle, rgba(0, 240, 255, 0.32) 0%, rgba(10, 20, 38, 0.88) 75%);
            border: 2px solid #00f0ff;
            box-shadow: 0 0 18px rgba(0, 240, 255, 0.6), inset 0 0 12px rgba(0, 240, 255, 0.35);
        }
        .btn-neutral-glow {
            background: rgba(14, 18, 34, 0.82);
            border: 1.5px solid rgba(180, 220, 255, 0.55);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
        }
        #sandy-fx {
            pointer-events: none;
            position: absolute;
            inset: 0;
            z-index: 4;
            opacity: 0;
            transition: opacity 0.25s ease;
            box-shadow: inset 0 0 110px rgba(0, 240, 255, 0.75), inset 0 0 220px rgba(255, 0, 128, 0.45);
        }
        #damage-fx {
            pointer-events: none;
            position: absolute;
            inset: 0;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.15s ease;
            box-shadow: inset 0 0 130px rgba(255, 0, 55, 0.9);
        }
        #target-reticle {
            position: absolute;
            width: 54px;
            height: 54px;
            pointer-events: none;
            transform: translate(-50%, -50%);
            display: none;
            z-index: 6;
        }
    </style>
</head>
<body class="w-full h-full relative overflow-hidden select-none">

    <!-- 3D Сцена -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Экранные спецэффекты -->
    <div id="sandy-fx"></div>
    <div id="damage-fx"></div>

    <!-- Прицел автонаведения на враге (как на скриншоте) -->
    <div id="target-reticle">
        <svg viewBox="0 0 64 64" class="w-full h-full animate-spin" style="animation-duration: 5s;">
            <circle cx="32" cy="32" r="26" fill="none" stroke="#ff2a6d" stroke-width="2" stroke-dasharray="10 6"/>
            <circle cx="32" cy="32" r="18" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-Opacity="0.8"/>
            <line x1="32" y1="0" x2="32" y2="12" stroke="#ff2a6d" stroke-width="2"/>
            <line x1="32" y1="52" x2="32" y2="64" stroke="#ff2a6d" stroke-width="2"/>
            <line x1="0" y1="32" x2="12" y2="32" stroke="#ff2a6d" stroke-width="2"/>
            <line x1="52" y1="32" x2="64" y2="32" stroke="#ff2a6d" stroke-width="2"/>
            <circle cx="32" cy="32" r="3" fill="#00f0ff"/>
        </svg>
    </div>

    <!-- ==================== ВЕРХНИЙ HUD (ТОЧНО ПО СКРИНШОТУ) ==================== -->
    <div class="absolute top-0 left-0 w-full px-2.5 py-2 sm:px-4 sm:py-2.5 z-10 pointer-events-none flex justify-between items-start">

        <!-- Левый верхний блок: Аватар героя + HP и ENERGY -->
        <div class="flex items-center space-x-2 pointer-events-auto">
            <!-- Гексагональный аниме-портрет (компактный) -->
            <div class="relative w-11 h-12 sm:w-13 sm:h-14 flex items-center justify-center">
                <div class="w-full h-full bg-gradient-to-b from-cyan-400 via-blue-600 to-purple-700 p-[2px] hex-avatar shadow-[0_0_12px_rgba(0,240,255,0.6)]">
                    <div class="w-full h-full bg-[#101528] hex-avatar flex items-center justify-center overflow-hidden">
                        <!-- SVG Аниме-портрет беловолосого героя -->
                        <svg viewBox="0 0 100 100" class="w-full h-full">
                            <defs>
                                <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
                                    <stop offset="0%" stop-color="#1a103c"/>
                                    <stop offset="100%" stop-color="#09203f"/>
                                </linearGradient>
                            </defs>
                            <rect width="100" height="100" fill="url(#bgGrad)"/>
                            <path d="M15 100 L30 68 L70 68 L85 100 Z" fill="#181b28" stroke="#00f0ff" stroke-width="2"/>
                            <path d="M42 62 L42 76 L58 76 L58 62 Z" fill="#f3cfb6"/>
                            <path d="M32 36 Q32 68 50 72 Q68 68 68 36 Z" fill="#ffdfc4"/>
                            <ellipse cx="41" cy="50" rx="4.5" ry="3" fill="#00f0ff"/>
                            <ellipse cx="59" cy="50" rx="4.5" ry="3" fill="#00f0ff"/>
                            <circle cx="41" cy="50" r="1.8" fill="#061224"/>
                            <circle cx="59" cy="50" r="1.8" fill="#061224"/>
                            <path d="M35 44 L46 46" stroke="#8899aa" stroke-width="2" stroke-linecap="round"/>
                            <path d="M65 44 L54 46" stroke="#8899aa" stroke-width="2" stroke-linecap="round"/>
                            <path d="M46 61 Q50 64 55 60" stroke="#b57c68" stroke-width="1.8" fill="none"/>
                            <path d="M22 44 L16 28 L30 30 L26 14 L42 24 L50 8 L58 24 L74 14 L70 30 L84 28 L78 44 L72 34 L64 46 L56 32 L50 44 L44 32 L36 46 L28 34 Z" fill="#eef5ff" stroke="#a5c4d4" stroke-width="1.2"/>
                        </svg>
                    </div>
                </div>
                <div class="absolute -bottom-1 bg-[#0b1022] border border-cyan-400/70 px-1.5 py-0 rounded text-[9px] font-hud font-bold text-white shadow">
                    Lv 1 <span class="text-cyan-400">⚡</span>
                </div>
            </div>

            <!-- Полоски HP и ENERGY -->
            <div class="flex flex-col space-y-1">
                <!-- HP BAR -->
                <div class="w-32 sm:w-44 h-5 bg-[#141024]/90 border border-pink-500/75 skew-bar p-0.5 relative shadow-[0_0_10px_rgba(255,42,109,0.35)]">
                    <div id="hp-fill" class="h-full bg-gradient-to-r from-[#e01e5a] via-[#ff2a6d] to-[#ff5e8e] transition-all duration-150" style="width: 100%;"></div>
                    <div class="absolute inset-0 flex items-center justify-between px-2.5 skew-bar-inner text-[10px] sm:text-[11px] font-hud font-bold text-white drop-shadow">
                        <span>HP</span>
                        <span id="hp-text">320 / 320</span>
                    </div>
                </div>
                <!-- ENERGY BAR -->
                <div class="w-28 sm:w-36 h-3.5 bg-[#0d182e]/90 border border-cyan-400/75 skew-bar p-0.5 relative shadow-[0_0_8px_rgba(0,240,255,0.3)]">
                    <div id="energy-fill" class="h-full bg-gradient-to-r from-[#0077ff] via-[#00c3ff] to-[#00f0ff] transition-all duration-150" style="width: 100%;"></div>
                    <div class="absolute inset-0 flex items-center justify-between px-2 skew-bar-inner text-[8px] sm:text-[9px] font-hud font-bold text-cyan-100 drop-shadow">
                        <span>ENERGY</span>
                        <span id="energy-text">100 / 100</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Центральный верхний блок: Дистанция и Рекорд -->
        <div class="flex flex-col items-center">
            <div id="hud-distance" class="font-hud text-xl sm:text-3xl font-extrabold text-white tracking-wider drop-shadow-[0_2px_10px_rgba(0,240,255,0.75)] leading-none">
                0 m
            </div>
            <div class="h-[1px] w-24 sm:w-32 bg-gradient-to-r from-transparent via-cyan-400/80 to-transparent my-0.5"></div>
            <div class="font-hud text-[10px] sm:text-[11px] font-bold tracking-widest text-amber-300/95 uppercase leading-none">
                BEST <span id="hud-best">7,380 m</span>
            </div>
            <!-- Индикатор Комбо и Overdrive -->
            <div id="hud-combo-box" class="mt-1 px-2.5 py-0.5 rounded-full bg-pink-600/30 border border-pink-400/70 text-[10px] font-cyber font-bold text-pink-200 shadow-[0_0_12px_rgba(255,42,109,0.6)] hidden">
                COMBO <span id="hud-combo">x2</span> <span id="hud-overdrive" class="text-cyan-300 ml-1 hidden">⚡ OVERDRIVE</span>
            </div>
        </div>

        <!-- Правый верхний блок: Кредиты, Убийства, Пауза -->
        <div class="flex items-center space-x-1.5 sm:space-x-2 pointer-events-auto">
            <!-- Счётчик монет -->
            <div class="hud-panel px-2 py-1 rounded-lg flex items-center space-x-1.5">
                <div class="w-3.5 h-3.5 rounded-full bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center text-[9px] font-black text-black shadow-[0_0_6px_#fbbf24]">₢</div>
                <span id="hud-coins" class="font-hud text-xs sm:text-sm font-bold text-amber-300">0</span>
            </div>
            <!-- Счётчик уничтоженных врагов -->
            <div class="hud-panel px-2 py-1 rounded-lg flex items-center space-x-1.5">
                <svg class="w-3.5 h-3.5 text-pink-400" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2C7.03 2 3 6.03 3 11c0 2.78 1.26 5.27 3.25 6.92V21c0 .55.45 1 1 1h9.5c.55 0 1-.45 1-1v-3.08C19.74 16.27 21 13.78 21 11c0-4.97-4.03-9-9-9zm-3 10c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm6 0c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
                </svg>
                <span id="hud-kills" class="font-hud text-xs sm:text-sm font-bold text-white">0</span>
            </div>
            <!-- Кнопка Звука -->
            <button id="btn-sound" class="hud-panel w-8 h-8 rounded-lg flex items-center justify-center text-cyan-300 active:scale-90 transition" title="Звук">
                <span id="sound-label" class="text-xs font-bold">🔊</span>
            </button>
            <!-- Кнопка Паузы -->
            <button id="btn-pause" class="hud-panel w-8 h-8 rounded-lg flex items-center justify-center text-white text-xs font-bold active:scale-90 transition">
                ❚❚
            </button>
        </div>
    </div>

    <!-- ==================== ЛЕВАЯ ПАМЯТКА И КОМПАКТНЫЙ ДЖОЙСТИК ==================== -->
    <div class="hidden sm:flex absolute left-3 top-1/2 -translate-y-14 z-10 pointer-events-none flex-col space-y-1 hud-panel p-2 rounded-lg text-[11px] text-gray-200 border-white/15 bg-black/40">
        <div class="flex items-center space-x-1.5">
            <span class="w-4 h-4 rounded bg-cyan-500/20 border border-cyan-400/40 flex items-center justify-center text-[10px] font-bold text-cyan-300">↑</span>
            <span>Прыжок</span>
        </div>
        <div class="flex items-center space-x-1.5">
            <span class="w-4 h-4 rounded bg-cyan-500/20 border border-cyan-400/40 flex items-center justify-center text-[10px] font-bold text-cyan-300">↓</span>
            <span>Подкат</span>
        </div>
        <div class="flex items-center space-x-1.5">
            <span class="w-4 h-4 rounded bg-cyan-500/20 border border-cyan-400/40 flex items-center justify-center text-[10px] font-bold text-cyan-300">↔</span>
            <span>Полоса</span>
        </div>
    </div>

    <!-- Виртуальный тактильный джойстик внизу слева (компактный, не закрывает обзор) -->
    <div id="joystick-zone" class="absolute bottom-3.5 left-3.5 z-20 w-20 h-20 sm:w-24 sm:h-24 rounded-full border border-cyan-400/30 bg-black/30 backdrop-blur-sm flex items-center justify-center pointer-events-auto">
        <span class="absolute top-1 text-[8px] text-cyan-300/60">▲</span>
        <span class="absolute bottom-1 text-[8px] text-cyan-300/60">▼</span>
        <span class="absolute left-1.5 text-[8px] text-cyan-300/60">◀</span>
        <span class="absolute right-1.5 text-[8px] text-cyan-300/60">▶</span>
        <div id="joystick-knob" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-cyan-400/25 border border-cyan-300/70 shadow-[0_0_10px_rgba(0,240,255,0.45)] transition-transform duration-75"></div>
    </div>

    <!-- ==================== ПРАВЫЙ НИЖНИЙ БЛОК КОМПАКТНЫХ БОЕВЫХ КНОПОК ==================== -->
    <div class="absolute bottom-3 right-3 z-20 pointer-events-none flex flex-col items-end space-y-1.5">

        <!-- Сандевистан -->
        <div class="flex flex-col items-center pointer-events-auto mr-0.5">
            <button id="btn-sandy" class="action-circle btn-sandy-glow w-11 h-11 sm:w-12 sm:h-12 flex items-center justify-center">
                <svg class="w-6 h-6 text-cyan-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 4a2 2 0 100-4 2 2 0 000 4zM7 21l3-6 2 2v5h2v-6.5l-2.5-2.5 1-3.5 3 2.5H19v-2h-2.5l-3.5-3c-.7-.6-1.7-.7-2.5-.2L6 9.5V14h2v-3l2-1-1.5 4.5L5 19l2 2z"/>
                    <path stroke-linecap="round" d="M2 10h3M1 14h4M2 18h2" stroke="#00f0ff" stroke-width="1.8"/>
                </svg>
            </button>
            <span class="text-[9px] text-cyan-200 font-semibold mt-0.5 drop-shadow">Сандевистан [Q]</span>
        </div>

        <!-- Кибер-Рывок (Cyber Dash) -->
        <div class="flex flex-col items-center pointer-events-auto mr-0.5">
            <button id="btn-dash" class="action-circle btn-neutral-glow w-10 h-10 sm:w-11 sm:h-11 flex items-center justify-center text-amber-300 border-amber-400/70 shadow-[0_0_14px_rgba(251,191,36,0.45)]">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/>
                </svg>
            </button>
            <span class="text-[9px] text-amber-200 font-semibold mt-0.5 drop-shadow">Рывок [SHIFT]</span>
        </div>

        <!-- Кнопка автоприцела -->
        <div class="pointer-events-auto mr-1">
            <button id="btn-aim" class="action-circle btn-neutral-glow w-9 h-9 flex items-center justify-center text-cyan-200">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="8"/>
                    <circle cx="12" cy="12" r="2" fill="currentColor"/>
                    <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
                </svg>
            </button>
        </div>

        <!-- Нижний ряд: Смена оружия, Катана, Огонь -->
        <div class="flex items-end space-x-2 sm:space-x-2.5 pointer-events-auto">
            <!-- Смена оружия -->
            <div class="flex flex-col items-center">
                <button id="btn-swap" class="action-circle btn-neutral-glow w-9 h-9 sm:w-10 sm:h-10 flex items-center justify-center text-white">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                </button>
                <span class="text-[9px] text-gray-300 mt-0.5">Оружие</span>
            </div>

            <!-- Катана -->
            <div class="flex flex-col items-center">
                <button id="btn-katana" class="action-circle btn-katana-glow w-12 h-12 sm:w-13 sm:h-13 flex items-center justify-center">
                    <svg class="w-6 h-6 text-pink-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 4.5l-11 11m0 0L5 19l-1.5-1.5L7 14m1.5 1.5l-2-2m13-9l-9 9"/>
                    </svg>
                </button>
                <span class="text-[9px] text-gray-200 font-semibold mt-0.5">Катана [E]</span>
            </div>

            <!-- Огонь -->
            <div class="flex flex-col items-center">
                <button id="btn-fire" class="action-circle btn-fire-glow w-15 h-15 sm:w-16 sm:h-16 flex items-center justify-center">
                    <svg class="w-9 h-9 text-pink-300 -rotate-25" viewBox="0 0 64 32" fill="currentColor">
                        <path d="M4 14 L16 14 L18 10 L44 10 L46 13 L58 13 L58 16 L46 16 L44 19 L34 19 L32 27 L27 27 L29 19 L20 19 L17 25 L12 25 L14 18 L4 18 Z"/>
                        <rect x="24" y="6" width="12" height="3" rx="1" fill="#ff99bb"/>
                    </svg>
                </button>
                <span class="text-[10px] text-white font-bold mt-0.5">Огонь [SPACE]</span>
            </div>
        </div>
    </div>

    <!-- ==================== МОДАЛЬНОЕ ОКНО ПАУЗЫ / GAME OVER ==================== -->
    <div id="modal-overlay" class="absolute inset-0 z-30 flex items-center justify-center p-4 bg-black/75 backdrop-blur-md hidden">
        <div class="hud-panel max-w-md w-full p-6 sm:p-8 rounded-2xl text-center border-cyan-400/60 flex flex-col items-center shadow-[0_0_40px_rgba(0,240,255,0.3)]">
            <h2 id="modal-title" class="font-cyber text-2xl sm:text-3xl font-extrabold text-white tracking-wider mb-1">ПАУЗА</h2>
            <p id="modal-subtitle" class="text-xs font-hud uppercase tracking-widest text-cyan-300 mb-5">Нейролинк в режиме ожидания</p>

            <div class="grid grid-cols-3 gap-2.5 w-full mb-6">
                <div class="bg-white/5 p-3 rounded-xl border border-white/10">
                    <div class="text-[10px] text-gray-400 uppercase font-bold">Дистанция</div>
                    <div id="stat-dist" class="font-hud text-xl font-bold text-cyan-300 mt-0.5">0 m</div>
                </div>
                <div class="bg-white/5 p-3 rounded-xl border border-white/10">
                    <div class="text-[10px] text-gray-400 uppercase font-bold">Кредиты</div>
                    <div id="stat-coins" class="font-hud text-xl font-bold text-amber-300 mt-0.5">0</div>
                </div>
                <div class="bg-white/5 p-3 rounded-xl border border-white/10">
                    <div class="text-[10px] text-gray-400 uppercase font-bold">Фраги</div>
                    <div id="stat-kills" class="font-hud text-xl font-bold text-pink-400 mt-0.5">0</div>
                </div>
            </div>

            <div class="flex flex-col space-y-3 w-full">
                <button id="btn-resume" class="w-full py-3.5 rounded-xl font-cyber text-sm uppercase font-bold text-black bg-cyan-400 hover:bg-cyan-300 shadow-[0_0_20px_rgba(0,240,255,0.6)] active:scale-95 transition cursor-pointer">
                    Продолжить
                </button>
                <button id="btn-restart" class="w-full py-3.5 rounded-xl font-cyber text-sm uppercase font-bold text-white bg-gradient-to-r from-pink-600 to-purple-600 shadow-[0_0_20px_rgba(255,42,109,0.5)] active:scale-95 transition cursor-pointer">
                    Новый забег
                </button>
            </div>
        </div>
    </div>

    <!-- ========================================================================= -->
    <!-- 3D ДВИЖОК И ИГРОВАЯ ЛОГИКА                                                -->
    <!-- ========================================================================= -->
    <script>
        // Инициализация глобальных переменных сцены, камеры и рендерера
        let scene, camera, renderer;
        const state = {
            mode: 'PLAY', // PLAY, PAUSE, GAMEOVER
            hp: 320,
            maxHp: 320,
            energy: 100,
            maxEnergy: 100,
            distance: 0,
            bestDistance: parseInt(localStorage.getItem('cyber_runner_best3d') || '7380', 10),
            coins: 286,
            kills: 12,
            speed: 36,
            maxSpeed: 68,
            sandyActive: false,
            weaponMode: 0,
            firing: false,
            lastShot: 0,
            katanaTimer: 0,
            katanaDuration: 0.32,

        // ==========================================
        // 1. Звуковой синтезатор (Web Audio API)
        // ==========================================
        class CyberAudio {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }
            init() {
                if (!this.ctx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (AC) this.ctx = new AC();
                }
                if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            }
            play(f1, f2, dur, type = 'sawtooth', gainVal = 0.12) {
                if (!this.enabled || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(f1, now);
                    osc.frequency.exponentialRampToValueAtTime(Math.max(20, f2), now + dur);
                    gain.gain.setValueAtTime(gainVal, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + dur);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + dur);
                } catch (e) {}
            }
            shoot() { this.play(720, 110, 0.09, 'sawtooth', 0.11); }
            katana() { this.play(1200, 260, 0.14, 'triangle', 0.2); }
            jump() { this.play(220, 560, 0.16, 'sine', 0.14); }
            slide() { this.play(340, 120, 0.18, 'triangle', 0.14); }
            coin() {
                this.play(880, 1320, 0.07, 'sine', 0.12);
                setTimeout(() => this.play(1320, 1760, 0.1, 'sine', 0.12), 55);
            }
            hit() { this.play(130, 38, 0.26, 'sawtooth', 0.24); }
            sandy() { this.play(240, 55, 0.45, 'sine', 0.22); }
            dash() { this.play(180, 920, 0.22, 'sawtooth', 0.18); }
            pickup() {
                this.play(520, 880, 0.12, 'triangle', 0.15);
                setTimeout(() => this.play(880, 1480, 0.16, 'sine', 0.15), 70);
            }
        }

        function createWetAsphaltTexture() {
            const c = document.createElement('canvas');
            c.width = 1024;
            c.height = 1024;
            const ctx = c.getContext('2d');

            // Глубокий мокрый асфальт с контрастными отражениями
            const grad = ctx.createLinearGradient(0, 0, 1024, 0);
            grad.addColorStop(0, '#160b2e');
            grad.addColorStop(0.18, '#0c1428');
            grad.addColorStop(0.5, '#090e1c');
            grad.addColorStop(0.82, '#0c1428');
            grad.addColorStop(1, '#220b2c');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1024, 1024);

            // Микрорельеф асфальта и зеркальные лужи
            for (let i = 0; i < 900; i++) {
                ctx.fillStyle = i % 4 === 0
                    ? 'rgba(0, 240, 255, 0.08)'
                    : (i % 3 === 0 ? 'rgba(255, 42, 109, 0.08)' : 'rgba(255, 255, 255, 0.035)');
                const w = 14 + Math.random() * 110;
                const h = 2 + Math.random() * 8;
                ctx.fillRect(Math.random() * 1024, Math.random() * 1024, w, h);
            }

            // Подсветка центров трёх полос (чтобы игрок мгновенно считывал 3 коридора движения)
            const laneCenters = [226, 512, 798];
            laneCenters.forEach((lx, idx) => {
                const laneGlow = ctx.createLinearGradient(lx - 90, 0, lx + 90, 0);
                const col = idx === 1 ? '0, 240, 255' : '255, 42, 133';
                laneGlow.addColorStop(0, `rgba(${col}, 0)`);
                laneGlow.addColorStop(0.5, `rgba(${col}, 0.13)`);
                laneGlow.addColorStop(1, `rgba(${col}, 0)`);
                ctx.fillStyle = laneGlow;
                ctx.fillRect(lx - 90, 0, 180, 1024);

                // Тонкая направляющая техно-линия по центру каждой полосы
                ctx.fillStyle = idx === 1 ? 'rgba(0, 240, 255, 0.35)' : 'rgba(255, 77, 166, 0.3)';
                for (let y = 0; y < 1024; y += 128) {
                    ctx.fillRect(lx - 2, y + 20, 4, 55);
                }
            });

            // Яркие боковые аварийные линии у отбойников
            ctx.shadowColor = '#ff9900';
            ctx.shadowBlur = 14;
            ctx.fillStyle = '#ffaa00';
            ctx.fillRect(16, 0, 14, 1024);
            ctx.fillRect(994, 0, 14, 1024);

            // Чёткие неоновые разделители между левой, центральной и правой полосой
            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 22;
            ctx.fillStyle = '#00f0ff';
            ctx.fillRect(364, 0, 10, 1024);
            ctx.fillRect(650, 0, 10, 1024);

            // Яркий белый сердечник линий разметки + пунктир
            ctx.shadowBlur = 8;
            ctx.fillStyle = '#e8fbff';
            for (let y = 0; y < 1024; y += 96) {
                ctx.fillRect(366, y, 6, 58);
                ctx.fillRect(652, y, 6, 58);
            }

            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(1, 3);
            return tex;
        }

        function createBuildingWindowsTexture(accentColor) {
            const c = document.createElement('canvas');
            c.width = 256;
            c.height = 512;
            const ctx = c.getContext('2d');

            ctx.fillStyle = '#0b0e1d';
            ctx.fillRect(0, 0, 256, 512);

            // Вертикальные архитектурные линии небоскрёба
            ctx.fillStyle = '#141a33';
            for (let x = 0; x < 256; x += 32) {
                ctx.fillRect(x, 0, 4, 512);
            }

            // Светящиеся окна
            for (let y = 12; y < 500; y += 18) {
                for (let x = 8; x < 248; x += 24) {
                    const r = Math.random();
                    if (r > 0.38) {
                        if (r > 0.88) ctx.fillStyle = accentColor;
                        else if (r > 0.72) ctx.fillStyle = '#00f0ff';
                        else if (r > 0.55) ctx.fillStyle = '#ffd166';
                        else ctx.fillStyle = '#3a5088';
                        ctx.fillRect(x, y, 14, 10);
                    }
                }
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        // Генератор неоновых рекламных билбордов как на скриншоте (KIZUNA, NEXUS, ARASAKA, KIROSHI)
        function createBillboardTexture(preset) {
            const c = document.createElement('canvas');

                ctx.fillStyle = '#ff66cc';
                ctx.beginPath();
                ctx.arc(200, 210, 120, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffe5ec';
                ctx.beginPath();
                ctx.arc(200, 225, 78, 0, Math.PI * 2);

                ctx.fillStyle = '#d8f3dc';
                ctx.beginPath();
                ctx.arc(256, 185, 68, 0, Math.PI * 2);

        // Вспышка выстрела (Muzzle Flash)

        // Динамическая дуга-полумесяц рассечения воздуха перед героем (не плоский диск)

        const outerWaveMat = new THREE.MeshBasicMaterial({

        // Двухсуставные ноги (Бедро -> Колено с наколенником -> Голень -> Неоновый кроссовок)
        function createCyberLeg(isLeft) {

            const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.135, 0.105, 0.46, 14), pantsMat);
            thigh.position.y = -0.23;

            // Кибер-наколенник со светодиодом
            const kneePad = new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 10), armorJointMat);
            kneePad.position.set(0, -0.46, -0.03);
            const kneeLed = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.04, 0.04), neonCyanMat);
            kneeLed.position.set(0, -0.46, -0.13);
            hipPivot.add(kneePad, kneeLed);

            // Сустав голени (сгибается в колене при беге и прыжке)
            const shinPivot = new THREE.Group();
            shinPivot.position.y = -0.46;

            const sneakerGroup = new THREE.Group();

            soleGlow.position.y = -0.07;
            const heelStrip = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.14, 0.05), neonCyanMat);
            heelStrip.position.set(0, 0.02, 0.19);
            sneakerGroup.add(shoeUpper, soleGlow, heelStrip);

        const leftLeg = createCyberLeg(true);

        const hero = {
            lane: 1,
            targetX: 0,
            y: 0,
            vy: 0,
            jumping: false,
            sliding: false,
            slideTime: 0,
            trailTimer: 0
        };

        // ==========================================
        // 6. Построение Объёмного Мегаполиса, Мокрого Шоссе и Трафика
        // ==========================================
        const asphaltTex = createWetAsphaltTexture();
        const winTexPink = createBuildingWindowsTexture('#ff2a85');
        const winTexCyan = createBuildingWindowsTexture('#00f0ff');
        const billboardTextures = [
            createBillboardTexture('KIZUNA'),
            createBillboardTexture('NEXUS'),
            createBillboardTexture('ARASAKA'),
            createBillboardTexture('KIROSHI')
        ];

        const roadMat = new THREE.MeshStandardMaterial({
            map: asphaltTex,
            roughness: 0.14,
            metalness: 0.72
        });
        const barrierMat = new THREE.MeshStandardMaterial({ color: 0x23273a, roughness: 0.45, metalness: 0.6 });
        const darkMetalMat = new THREE.MeshStandardMaterial({ color: 0x151824, roughness: 0.4, metalness: 0.8 });
        const orangeLightMat = new THREE.MeshBasicMaterial({ color: 0xff9900 });
        const redLightMat = new THREE.MeshBasicMaterial({ color: 0xff1e56 });

        const SEG_LENGTH = 56;
        const SEG_COUNT = 7;
        const segments = [];
        const flyingCars = [];

        function createCitySegment(zPos, index) {
            const group = new THREE.Group();
            group.position.z = zPos;

            // 1. Полотно мокрого 3-полосного шоссе + физические светящиеся направляющие полос
            const road = new THREE.Mesh(new THREE.BoxGeometry(12.4, 0.4, SEG_LENGTH), roadMat);
            road.position.y = -0.2;
            group.add(road);

            // Рельефные неоновые разделители полос (-1.7 и +1.7), гарантирующие идеальную читаемость 3 полос
            [-1.7, 1.7].forEach(divX => {
                const strip = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.03, SEG_LENGTH), neonCyanMat);
                strip.position.set(divX, 0.015, 0);
                group.add(strip);
            });

            // 2. Объёмные наклонные отбойники Jersey Barrier + фонарные столбы освещения
            [-6.35, 6.35].forEach(sideX => {
                const dir = sideX > 0 ? 1 : -1;
                const wallBase = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.7, SEG_LENGTH), barrierMat);
                wallBase.position.set(sideX, 0.35, 0);
                const wallTop = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.65, SEG_LENGTH), darkMetalMat);
                wallTop.position.set(sideX, 1.0, 0);
                group.add(wallBase, wallTop);

                for (let lz = -SEG_LENGTH / 2 + 5; lz < SEG_LENGTH / 2; lz += 10) {
                    const hazardLight = new THREE.Mesh(
                        new THREE.BoxGeometry(0.16, 0.22, 2.2),
                        lz % 20 === 0 ? orangeLightMat : redLightMat
                    );
                    hazardLight.position.set(sideX - dir * 0.42, 0.48, lz);
                    group.add(hazardLight);
                }

                // Арочные кибер-фонари вдоль трассы
                for (let pz = -SEG_LENGTH / 2 + 12; pz < SEG_LENGTH / 2; pz += 28) {
                    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, 8.5, 8), darkMetalMat);
                    pole.position.set(sideX + dir * 0.6, 4.25, pz);
                    const arm = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.18, 0.22), darkMetalMat);
                    arm.position.set(sideX - dir * 0.5, 8.4, pz);
                    const lamp = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.12, 0.35), dir > 0 ? neonCyanMat : neonPinkMat);
                    lamp.position.set(sideX - dir * 0.9, 8.28, pz);
                    group.add(pole, arm, lamp);
                }
            });

            // 3. Многоярусные объёмные небоскрёбы с карнизами, трубами, вентблоками и голограммами
            [-1, 1].forEach((dir, sIdx) => {
                for (let b = 0; b < 2; b++) {
                    const bWidth = 14 + (index % 2) * 4;
                    const bHeight = 46 + ((index + b) % 3) * 18;
                    const bDepth = 22;
                    const isPink = (b + sIdx) % 2 === 0;
                    const bMat = new THREE.MeshStandardMaterial({
                        map: isPink ? winTexPink : winTexCyan,
                        roughness: 0.35,
                        metalness: 0.45
                    });

                    const bGroup = new THREE.Group();
                    const bx = dir * (14.8 + bWidth / 2);
                    const bz = -SEG_LENGTH / 4 + b * (SEG_LENGTH / 2);
                    bGroup.position.set(bx, 0, bz);

                    // Основной корпус + выступающий средний ярус + верхняя башня
                    const mainTower = new THREE.Mesh(new THREE.BoxGeometry(bWidth, bHeight, bDepth), bMat);
                    mainTower.position.y = bHeight / 2 - 2;
                    bGroup.add(mainTower);

                    const podium = new THREE.Mesh(new THREE.BoxGeometry(bWidth + 2.6, 14, bDepth + 1.5), darkMetalMat);
                    podium.position.y = 5;
                    bGroup.add(podium);

                    // Светящиеся архитектурные карнизы по этажам и вертикальные неоновые рёбра
                    const accentMat = isPink ? neonPinkMat : neonCyanMat;
                    [12, 24, 36].forEach(ledgeY => {
                        if (ledgeY < bHeight - 4) {
                            const ledge = new THREE.Mesh(new THREE.BoxGeometry(bWidth + 1.2, 0.45, bDepth + 0.8), accentMat);
                            ledge.position.y = ledgeY;
                            bGroup.add(ledge);
                        }
                    });

                    const vFin = new THREE.Mesh(new THREE.BoxGeometry(0.45, bHeight, 0.65), accentMat);
                    vFin.position.set(-dir * (bWidth / 2 + 0.2), bHeight / 2, bDepth / 3);
                    bGroup.add(vFin);

                    // Промышленные трубы и вентиляционные блоки на нижнем уровне фасада
                    for (let p = -1; p <= 1; p += 2) {
                        const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 16, 8), barrierMat);
                        pipe.position.set(-dir * (bWidth / 2 + 1.35), 7, p * 5);
                        const hvacBox = new THREE.Mesh(new THREE.BoxGeometry(1.4, 2.2, 3.2), barrierMat);
                        hvacBox.position.set(-dir * (bWidth / 2 + 1.4), 5.5 + p * 2, p * 2.2);
                        bGroup.add(pipe, hvacBox);
                    }

                    // Антенны и сигнальные маяки на крыше
                    const spire = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.35, 12, 8), darkMetalMat);
                    spire.position.set(0, bHeight + 4, 0);
                    const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.45, 8, 8), redLightMat);
                    beacon.position.set(0, bHeight + 10, 0);
                    bGroup.add(spire, beacon);

                    group.add(bGroup);

                    // Вынесенный вперёд голографический билборд на стальных фермах с неоновой рамкой
                    const tex = billboardTextures[(index + b + (dir > 0 ? 1 : 0)) % billboardTextures.length];
                    const holoGroup = new THREE.Group();
                    holoGroup.position.set(dir * 8.4, 11.5 + (b % 2) * 4.5, bz);
                    holoGroup.rotation.y = dir > 0 ? -Math.PI / 2.35 : Math.PI / 2.35;

                    const frameMesh = new THREE.Mesh(new THREE.BoxGeometry(12.6, 14.6, 0.35), darkMetalMat);
                    frameMesh.position.z = -0.22;
                    const borderGlow = new THREE.Mesh(new THREE.BoxGeometry(13.0, 15.0, 0.15), accentMat);
                    borderGlow.position.z = -0.32;
                    const screenMesh = new THREE.Mesh(new THREE.PlaneGeometry(12.2, 14.2), new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
                    holoGroup.add(frameMesh, borderGlow, screenMesh);
                    group.add(holoGroup);
                }
            });

            // 4. Надземный мост-эстакада с мощными боковыми опорами
            if (index % 2 === 0) {
                const overpass = new THREE.Mesh(new THREE.BoxGeometry(34, 1.9, 5.2), darkMetalMat);
                overpass.position.set(0, 15.2, 0);
                const neonTrim = new THREE.Mesh(new THREE.BoxGeometry(34, 0.28, 5.4), neonCyanMat);
                neonTrim.position.set(0, 14.2, 0);
                [-9.5, 9.5].forEach(px => {
                    const pillar = new THREE.Mesh(new THREE.BoxGeometry(1.8, 16, 3.2), barrierMat);
                    pillar.position.set(px, 7.5, 0);
                    group.add(pillar);
                });
                group.add(overpass, neonTrim);
            }

            scene.add(group);
            return group;
        }

        for (let i = 0; i < SEG_COUNT; i++) {
            segments.push(createCitySegment(-i * SEG_LENGTH, i));
        }

        // Горизонт с силуэтами башен мегаполиса вдалеке
        const skylineGroup = new THREE.Group();
        scene.add(skylineGroup);
        for (let i = -5; i <= 5; i++) {
            const h = 80 + Math.abs(i % 3) * 38;
            const tower = new THREE.Mesh(
                new THREE.BoxGeometry(18, h, 18),
                new THREE.MeshBasicMaterial({ map: i % 2 === 0 ? winTexCyan : winTexPink })
            );
            tower.position.set(i * 22, h / 2 - 10, -295);
            skylineGroup.add(tower);
        }

        // Двусторонний воздушный трафик (летающие кибер-спиннеры с фарами и стоп-сигналами)
        for (let i = 0; i < 10; i++) {
            const spinner = new THREE.Group();
            const oncoming = i % 2 === 0;
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 1.1, 4.4, 8), darkMetalMat);
            body.rotation.x = Math.PI / 2;
            const canopy = new THREE.Mesh(new THREE.SphereGeometry(0.75, 10, 8), neonCyanMat);
            canopy.scale.set(0.9, 0.5, 1.6);
            canopy.position.y = 0.38;

            const frontLights = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.22, 0.2), new THREE.MeshBasicMaterial({ color: 0xffffff }));
            frontLights.position.z = oncoming ? 2.2 : -2.2;
            const tailLights = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.26, 0.2), redLightMat);
            tailLights.position.z = oncoming ? -2.2 : 2.2;

            spinner.add(body, canopy, frontLights, tailLights);
            spinner.position.set(
                (oncoming ? -1 : 1) * (5 + (i % 3) * 6.5),
                12 + (i % 4) * 4.5,
                -Math.random() * 260
            );
            scene.add(spinner);
            flyingCars.push({ mesh: spinner, speed: oncoming ? (28 + Math.random() * 20) : -(12 + Math.random() * 14) });
        }

        // ==========================================
        // 7. Детализированные 3D-Препятствия, Дроны, Грузовики и Киберсолдаты
        // ==========================================
        const obstacles = [];
        const enemies = [];
        const coins = [];
        const bullets = [];
        const particles = [];

        // 1) Футуристическая плазменная баррикада (Прыжок)
        function createHoloBarrierMesh() {
            const g = new THREE.Group();
            // Боковые наклонные генераторы поля
            [-1.22, 1.22].forEach(px => {
                const emitter = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.24, 1.32, 8), darkMetalMat);
                emitter.position.set(px, 0.66, 0);
                const emitterCap = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), neonPinkMat);
                emitterCap.position.set(px, 1.32, 0);
                g.add(emitter, emitterCap);
            });

            const basePlate = new THREE.Mesh(new THREE.BoxGeometry(2.65, 0.22, 0.58), barrierMat);
            basePlate.position.y = 0.11;
            g.add(basePlate);

            // Полупрозрачный плазменный щит с силовыми полосами
            const shield = new THREE.Mesh(
                new THREE.BoxGeometry(2.35, 1.02, 0.1),
                new THREE.MeshBasicMaterial({ color: 0xff1e42, transparent: true, opacity: 0.72 })
            );
            shield.position.y = 0.72;
            const topBeam = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.45, 8), new THREE.MeshBasicMaterial({ color: 0xffaa00 }));
            topBeam.rotation.z = Math.PI / 2;

            // Голограмма предупреждения ⚠️
            const tri = new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.52, 3), new THREE.MeshBasicMaterial({ color: 0xffffff }));
            tri.rotation.x = Math.PI / 2;
            tri.position.set(0, 0.74, 0.08);
            g.add(shield, topBeam, tri);
            return g;
        }

        // 2) Детализированный бронированный Кибер-Грузовик с кабиной, колёсами и фарами (Смена полосы)
        function createCyberTruckMesh() {
            const g = new THREE.Group();
            // Грузовой контейнер с рёбрами жёсткости и неоновыми полосами
            const cargo = new THREE.Mesh(new THREE.BoxGeometry(2.55, 2.35, 4.4), barrierMat);
            cargo.position.set(0, 1.55, -0.7);
            const neonStripe = new THREE.Mesh(new THREE.BoxGeometry(2.62, 0.18, 4.2), neonCyanMat);
            neonStripe.position.set(0, 1.65, -0.7);
            g.add(cargo, neonStripe);

            // Выступающая бронированная кабина с наклонным лобовым визором
            const cab = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.85, 1.9), darkMetalMat);
            cab.position.set(0, 1.25, 2.2);
            const visor = new THREE.Mesh(new THREE.BoxGeometry(2.15, 0.55, 0.15), neonCyanMat);

            [-0.85, 0.85].forEach(lx => {

                headlight.position.set(lx, 0.88, 3.18);

                });

        // 4) Спаренные охранные квадро-дроны, удерживающие высокий лазерный барьер (Подкат)
        function createSlideGateMesh() {
            const g = new THREE.Group();
            [-1.28, 1.28].forEach(dx => {
                const droneBody = new THREE.Mesh(new THREE.SphereGeometry(0.38, 12, 10), darkMetalMat);
                droneBody.scale.set(1.2, 0.7, 1.2);

            // Высокие горизонтальные лазерные лучи между дронами (низ на высоте 1.7м — нужно скользить)
